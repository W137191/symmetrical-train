name: Build debug APK

# 路径 B：推送到 GitHub 后自动编译 debug APK，发布到 GitHub Release（tag: AIPS）。
# debug 包由 Android 自动用 debug 密钥签名，无需任何密钥配置，安装零门槛；
# 标签用 AIPS 与仓库内监测工具（apk-latest）区分，避免用户下错 APK。

on:
  push:
    branches: [psapk]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Build debug APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.4
          arguments: assembleDebug

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          # 标签 AIPS：与监测工具 apk-latest 区分，避免混淆。
          # 不抢占 Latest 徽章（make_latest: false），下载请用显式标签地址 /download/AIPS/...
          tag_name: AIPS
          name: "AIPS 最新构建 #${{ github.run_number }}"
          prerelease: false
          make_latest: false
          body: |
            自动构建（GitHub Actions）· debug APK（Android 自动 debug 签名，无需密钥）。
            提交：${{ github.sha }}
            构建号：#${{ github.run_number }}
            安装：下载后允许“未知来源”安装即可。
          files: app/build/outputs/apk/debug/app-debug.apk
