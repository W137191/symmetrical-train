name: Build debug APK

# 推送到 GitHub 后自动编译 debug APK，发布到 GitHub Release（tag: AIPS）。
# debug 包由 Android 自动用 debug 密钥签名，无需任何密钥配置，安装零门槛；
# 标签用 AIPS 与仓库内监测工具（apk-latest）区分，避免用户下错 APK。
# 构建失败会把诊断 + build.log 尾部写入公开 Issue（标签 ci-build-log），便于远程排查。

on:
  push:
    branches: [psapk]
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read
  issues: write

jobs:
  release:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 手动安装 Android SDK（绕过在 Node24 下已失效的 android-actions/setup-android@v3）
      - name: Setup Android SDK (manual)
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"   # 必须与 ANDROID_HOME 一致，否则 AGP 报“SDK 路径冲突”
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline.zip
          unzip -q /tmp/cmdline.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true

      # 用仓库自带的 Gradle Wrapper 构建（自带 Gradle 8.4，不依赖 gradle 是否在 PATH）
      - name: Build debug APK
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Upload to GitHub Release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: AIPS
          name: "AIPS 最新构建 #${{ github.run_number }}"
          prerelease: false
          make_latest: false
          body: |
            自动构建（GitHub Actions）· debug APK（Android 自动 debug 签名，无需密钥）。
            提交：${{ github.sha }}
            构建号：#${{ github.run_number }}
            安装：下载后允许“未知来源”安装即可。
          files: app/build/outputs/apk/debug/app-debug.apk

      # 构建成功时关闭调试用 Issue（仅失败时创建），保持仓库清爽
      - name: 关闭调试Issue
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          LABEL: ci-build-log
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          repo = os.environ['GITHUB_REPOSITORY']; token = os.environ['GH_TOKEN']; label = os.environ['LABEL']
          base = f"https://api.github.com/repos/{repo}"
          hdr = {"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"}
          try:
              req = urllib.request.Request(f"{base}/issues?labels={label}&state=open", headers=hdr)
              issues = json.load(urllib.request.urlopen(req))
              for it in issues:
                  urllib.request.urlopen(urllib.request.Request(f"{base}/issues/{it['number']}", data=json.dumps({"state":"closed"}).encode(), headers=hdr, method="PATCH")).read()
                  print("CLOSED", it['number'])
          except Exception as e:
              print("CLOSE_ERR", e)
          PY

      # 保险：构建失败把诊断 + 错误日志写入公开 Issue（公开页面可被 WebFetch 读到，便于远程排查）
      - name: 公开错误日志(Issue)
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          LABEL: ci-build-log
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error, re, subprocess
          repo = os.environ['GITHUB_REPOSITORY']; token = os.environ['GH_TOKEN']; label = os.environ['LABEL']
          base = f"https://api.github.com/repos/{repo}"
          hdr = {"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"}
          diag = []
          diag.append("PWD=" + os.getcwd())
          diag.append("build.log exists: " + str(os.path.exists("build.log")))
          if os.path.exists("build.log"):
              diag.append("build.log size: " + str(os.path.getsize("build.log")))
          diag.append("gradlew exists: " + str(os.path.exists("gradlew")))
          try:
              diag.append("which gradle: " + subprocess.check_output(["bash","-c","command -v gradle || echo NONE"]).decode().strip())
          except Exception as e:
              diag.append("which gradle err: " + str(e))
          try:
              with open("build.log","r",encoding="utf-8",errors="replace") as f:
                  log = f.read()
          except Exception as e:
              log = "(build.log 未生成: %s)" % e
          clean = re.sub(r"\x1b\[[0-9;]*m","",log)
          lines = clean.splitlines()
          end_idx = next((i for i,l in enumerate(lines) if "BUILD FAILED" in l), None)
          if end_idx is None:
              seg = "\n".join(lines[-200:])
          else:
              seg = "\n".join(lines[max(0,end_idx-100):end_idx+6])
          body = json.dumps({"title":"CI 构建失败日志 (自动)","body":
                             "## 诊断\n```\n" + "\n".join(diag) + "\n```\n\n## build.log 尾部\n```\n" + seg + "\n```",
                             "labels":[label]}).encode()
          try:
              req = urllib.request.Request(f"{base}/issues?labels={label}&state=open", headers=hdr)
              issues = json.load(urllib.request.urlopen(req))
              if issues:
                  num = issues[0]['number']
                  urllib.request.urlopen(urllib.request.Request(f"{base}/issues/{num}", data=json.dumps({"body":json.loads(body)["body"]}).encode(), headers=hdr, method="PATCH")).read()
                  print("ISSUE_UPDATED", num)
              else:
                  r = urllib.request.urlopen(urllib.request.Request(f"{base}/issues", data=body, headers=hdr, method="POST")).read()
                  print("ISSUE_CREATED", json.loads(r)['number'])
          except urllib.error.HTTPError as e:
              print("ISSUE_FAIL", e.read().decode('utf-8','replace')[:800])
          PY
