<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qwen 聊天 · 校园内网</title>
<style>
  /* ===================== 主题变量（明暗两套） ===================== */
  :root{
    --bg:#0a0f1e; --bg2:#0c1424; --panel:#101a30; --panel2:#14203a;
    --border:rgba(150,185,255,.14); --border2:rgba(150,185,255,.26);
    --text:#e9effc; --text2:#9aabd0; --text3:#5f7099;
    --accent:#6fb7ff; --accent2:#9ccfff; --accent-dim:rgba(111,183,255,.13);
    --danger:#ff8095; --ok:#5fe3a1; --warn:#ffd479;
    --mono:"Cascadia Code","JetBrains Mono",Consolas,"Courier New",monospace;
    --user-bubble:linear-gradient(135deg,rgba(30,64,140,.55),rgba(40,80,160,.4));
    --user-border:rgba(111,183,255,.28);
  }
  html[data-theme="light"]{
    --bg:#f4f7fe; --bg2:#eaf0fb; --panel:#ffffff; --panel2:#eef3fc;
    --border:rgba(40,80,160,.14); --border2:rgba(40,80,160,.28);
    --text:#1a2238; --text2:#50607f; --text3:#8a98b8;
    --accent:#2f7bdc; --accent2:#1d63c4; --accent-dim:rgba(47,123,220,.1);
    --danger:#d6455f; --ok:#1f9d6b; --warn:#c98a16;
    --mono:"Cascadia Code","JetBrains Mono",Consolas,"Courier New",monospace;
    --user-bubble:linear-gradient(135deg,rgba(47,123,220,.16),rgba(47,123,220,.1));
    --user-border:rgba(47,123,220,.3);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--text);
    font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
    font-weight:300;font-size:15px;line-height:1.65;overflow:hidden;
    transition:background .25s,color .25s;
  }
  #app{display:flex;height:100vh}

  /* ===================== 侧栏 ===================== */
  #sidebar{
    width:272px;flex-shrink:0;height:100%;display:flex;flex-direction:column;
    background:linear-gradient(180deg,var(--bg2),var(--bg));
    border-right:1px solid var(--border);padding:16px 14px;gap:12px;
    transition:transform .25s ease;z-index:20;
  }
  html[data-theme="light"] #sidebar{background:var(--bg2)}
  .brand{display:flex;align-items:center;gap:10px;padding:2px 4px}
  .brand .diamond{
    width:30px;height:30px;flex-shrink:0;display:grid;place-items:center;
    border:1px solid var(--border2);border-radius:8px;color:var(--accent);
    font-size:14px;background:var(--accent-dim);
    box-shadow:0 0 14px rgba(111,183,255,.18) inset;
  }
  .brand h1{font-size:16px;font-weight:400;letter-spacing:.5px}
  .brand small{display:block;font-size:11px;color:var(--text3);font-weight:300}

  .btn{
    appearance:none;border:1px solid var(--border2);background:var(--accent-dim);
    color:var(--accent2);border-radius:8px;padding:9px 12px;font-size:13.5px;
    font-family:inherit;font-weight:400;cursor:pointer;transition:all .15s;text-align:center;
  }
  .btn:hover{background:rgba(111,183,255,.22);border-color:var(--accent)}

  /* 会话列表 */
  #convList{display:flex;flex-direction:column;gap:6px;overflow-y:auto;flex:1;padding-right:2px;margin:0 -2px;padding-left:2px}
  #convList::-webkit-scrollbar{width:4px}
  #convList::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
  .conv{
    display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:8px;
    cursor:pointer;border:1px solid transparent;transition:all .13s;position:relative;
  }
  .conv:hover{background:rgba(111,183,255,.07)}
  .conv.active{background:var(--accent-dim);border-color:var(--border2)}
  .conv .ci{font-size:13px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  .conv.active .ci{color:var(--accent2)}
  .conv .cdel{
    opacity:0;background:none;border:none;color:var(--text3);cursor:pointer;
    font-size:14px;padding:0 2px;transition:opacity .13s,color .13s;flex-shrink:0;
  }
  .conv:hover .cdel{opacity:1}
  .conv .cdel:hover{color:var(--danger)}

  .settings{display:flex;flex-direction:column;gap:12px;overflow-y:auto;flex-shrink:0;max-height:42%;padding-right:2px}
  .settings::-webkit-scrollbar{width:4px}
  .settings::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-size:12px;color:var(--text2);letter-spacing:.3px;display:flex;justify-content:space-between}
  .field label .val{color:var(--accent2);font-family:var(--mono);font-size:11px}
  textarea,input[type=number],select{
    background:rgba(255,255,255,.03);border:1px solid var(--border);
    border-radius:8px;color:var(--text);padding:8px 10px;font-size:13px;
    font-family:inherit;font-weight:300;outline:none;transition:border .15s;width:100%;
  }
  html[data-theme="light"] textarea,html[data-theme="light"] input[type=number],html[data-theme="light"] select{background:rgba(40,80,160,.04)}
  textarea:focus,input:focus,select:focus{border-color:var(--accent)}
  textarea{resize:vertical;min-height:60px}
  select option{background:var(--panel)}
  input[type=range]{width:100%;accent-color:var(--accent);cursor:pointer}
  .check{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text2);cursor:pointer;user-select:none}
  .check input{accent-color:var(--accent);width:15px;height:15px;cursor:pointer}

  .side-footer{font-size:11px;color:var(--text3);border-top:1px solid var(--border);padding-top:10px;line-height:1.7;font-family:var(--mono)}

  /* ===================== 主区 ===================== */
  main{flex:1;display:flex;flex-direction:column;min-width:0;height:100%}
  header{
    display:flex;align-items:center;gap:10px;padding:10px 18px;
    border-bottom:1px solid var(--border);background:rgba(10,15,30,.55);
    backdrop-filter:blur(6px);flex-shrink:0;
  }
  html[data-theme="light"] header{background:rgba(255,255,255,.6)}
  #menuBtn{display:none;background:none;border:none;color:var(--text2);font-size:20px;cursor:pointer}
  header .title{font-size:14px;font-weight:400;letter-spacing:.4px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header .title b{color:var(--accent2);font-weight:400}
  .hbtns{display:flex;gap:6px;align-items:center}
  .hbtn{
    background:rgba(255,255,255,.03);border:1px solid var(--border);color:var(--text2);
    border-radius:8px;font-size:12.5px;padding:6px 10px;cursor:pointer;font-family:inherit;
    transition:all .15s;display:flex;align-items:center;gap:5px;
  }
  .hbtn:hover{color:var(--accent2);border-color:var(--accent)}
  .hbtn.on{color:var(--accent2);border-color:var(--accent);background:var(--accent-dim)}
  .hbtn:disabled{opacity:.4;cursor:not-allowed}
  .hbtn:disabled:hover{color:var(--text2);border-color:var(--border)}

  #fileWarn{display:none;margin:10px 18px 0;padding:10px 14px;border:1px solid rgba(255,128,149,.4);background:rgba(255,128,149,.08);color:#ffb3c0;border-radius:8px;font-size:13px}

  /* ===================== 消息区 ===================== */
  #messages{flex:1;overflow-y:auto;padding:22px 18px 12px;scroll-behavior:auto}
  #messages::-webkit-scrollbar{width:6px}
  #messages::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
  .wrap{max-width:840px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

  .empty{text-align:center;padding:60px 20px;color:var(--text3)}
  .empty .big{font-size:40px;color:var(--accent);opacity:.85;margin-bottom:14px;text-shadow:0 0 24px rgba(111,183,255,.5)}
  .empty h2{font-size:18px;font-weight:400;color:var(--text2);margin-bottom:8px}
  .empty p{font-size:13px;margin-bottom:26px}
  .chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
  .chip{border:1px solid var(--border2);background:rgba(255,255,255,.02);color:var(--text2);border-radius:999px;padding:7px 16px;font-size:13px;cursor:pointer;transition:all .15s;font-family:inherit}
  .chip:hover{color:var(--accent2);border-color:var(--accent);background:var(--accent-dim)}

  .msg{display:flex;gap:10px;animation:fadeUp .25s ease}
  @keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .msg .avatar{width:30px;height:30px;flex-shrink:0;border-radius:8px;display:grid;place-items:center;font-size:13px;border:1px solid var(--border2);margin-top:2px}
  .msg.user .avatar{color:var(--text2);background:rgba(255,255,255,.03)}
  .msg.assistant .avatar{color:var(--accent);background:var(--accent-dim);box-shadow:0 0 12px rgba(111,183,255,.15) inset}
  .msg .body{min-width:0;flex:1;display:flex;flex-direction:column;gap:6px}
  .msg .who{font-size:11px;color:var(--text3);letter-spacing:.5px;display:flex;justify-content:space-between;align-items:center}
  .msg .who .mact{display:flex;gap:4px;opacity:0;transition:opacity .15s}
  .msg:hover .who .mact{opacity:1}
  .mbtn{background:none;border:1px solid var(--border);color:var(--text3);border-radius:6px;font-size:10.5px;padding:2px 8px;cursor:pointer;font-family:inherit;transition:all .15s}
  .mbtn:hover{color:var(--accent2);border-color:var(--accent)}
  .bubble{border-radius:10px;padding:12px 16px;font-size:14.5px;word-wrap:break-word;overflow-wrap:anywhere}
  .msg.user .bubble{background:var(--user-bubble);border:1px solid var(--user-border)}
  .msg.assistant .bubble{background:var(--panel);border:1px solid var(--border)}
  .msg.error .bubble{background:rgba(255,128,149,.07);border:1px solid rgba(255,128,149,.35);color:#ffb3c0}
  .msg.error .avatar{color:var(--danger);border-color:rgba(255,128,149,.4)}
  .msg .imgs{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
  .msg .imgs img{max-width:160px;max-height:160px;border-radius:8px;border:1px solid var(--border);cursor:pointer}
  .msg .files{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
  .msg .filechip{font-size:12px;color:var(--accent2);border:1px solid var(--border);border-radius:6px;padding:3px 9px;background:var(--accent-dim)}

  /* Markdown */
  .md p{margin:.45em 0}
  .md p:first-child{margin-top:0}.md p:last-child{margin-bottom:0}
  .md h1,.md h2,.md h3,.md h4{font-weight:500;margin:.8em 0 .4em;line-height:1.4}
  .md h1{font-size:1.25em}.md h2{font-size:1.15em}.md h3{font-size:1.05em}.md h4{font-size:1em}
  .md ul,.md ol{margin:.4em 0;padding-left:1.5em}
  .md li{margin:.2em 0}
  .md blockquote{border-left:2px solid var(--accent);padding:2px 12px;margin:.5em 0;color:var(--text2);background:rgba(111,183,255,.05);border-radius:0 6px 6px 0}
  .md hr{border:none;border-top:1px solid var(--border);margin:.9em 0}
  .md a{color:var(--accent2);text-decoration:none;border-bottom:1px dotted var(--accent)}
  .md a:hover{color:var(--accent)}
  .md code.inline{font-family:var(--mono);font-size:.88em;background:rgba(111,183,255,.1);border:1px solid var(--border);border-radius:4px;padding:1px 5px;color:var(--accent2)}
  .codeblock{border:1px solid var(--border);border-radius:8px;overflow:hidden;margin:.6em 0;background:#070c18}
  html[data-theme="light"] .codeblock{background:#0c1424}
  .code-head{display:flex;justify-content:space-between;align-items:center;padding:5px 12px;background:rgba(255,255,255,.03);border-bottom:1px solid var(--border);font-size:11px;color:var(--text3);font-family:var(--mono)}
  .code-head button{background:none;border:1px solid var(--border);color:var(--text3);border-radius:5px;font-size:10.5px;padding:2px 9px;cursor:pointer;font-family:inherit}
  .code-head button:hover{color:var(--accent2);border-color:var(--accent)}
  .codeblock pre{padding:12px 14px;overflow-x:auto}
  .codeblock pre::-webkit-scrollbar{height:6px}
  .codeblock pre::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
  .codeblock code{font-family:var(--mono);font-size:12.5px;line-height:1.6;color:#c9d8f5}

  .streaming .bubble::after{content:"▍";color:var(--accent);animation:blink 1s infinite;margin-left:1px}
  @keyframes blink{50%{opacity:0}}

  /* 思考过程折叠 */
  .thinking{border:1px solid var(--border);border-left:2px solid var(--accent);border-radius:8px;background:rgba(111,183,255,.045);font-size:13px;overflow:hidden}
  .thinking summary{cursor:pointer;padding:7px 14px;color:var(--text3);font-size:12px;user-select:none;list-style:none;display:flex;align-items:center;gap:6px}
  .thinking summary::-webkit-details-marker{display:none}
  .thinking summary::before{content:"▸";transition:transform .15s;font-size:10px}
  .thinking[open] summary::before{transform:rotate(90deg)}
  .thinking summary:hover{color:var(--text2)}
  .thinking-body{padding:4px 14px 12px;color:var(--text3);white-space:pre-wrap;font-size:12.5px;line-height:1.6;max-height:300px;overflow-y:auto;border-top:1px dashed var(--border)}

  /* ===================== 输入区 ===================== */
  #composer{border-top:1px solid var(--border);padding:12px 18px 14px;background:rgba(10,15,30,.5)}
  html[data-theme="light"] #composer{background:rgba(255,255,255,.55)}
  .composer-inner{max-width:840px;margin:0 auto}
  #attachBar{display:none;flex-wrap:wrap;gap:8px;margin-bottom:10px}
  #attachBar.show{display:flex}
  .att{display:flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid var(--border);border-radius:8px;background:var(--panel);font-size:12.5px;color:var(--text2);max-width:240px}
  .att img{max-width:34px;max-height:34px;border-radius:5px}
  .att .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .att .rm{background:none;border:none;color:var(--text3);cursor:pointer;font-size:14px}
  .att .rm:hover{color:var(--danger)}
  .composer-row{display:flex;gap:10px;align-items:flex-end}
  #input{flex:1;background:var(--panel);border:1px solid var(--border2);border-radius:10px;color:var(--text);padding:11px 14px;font-size:14.5px;font-family:inherit;font-weight:300;line-height:1.5;resize:none;outline:none;max-height:180px;transition:border .15s}
  #input:focus{border-color:var(--accent)}
  #input::placeholder{color:var(--text3)}
  #sendBtn,#stopBtn{flex-shrink:0;height:44px;border-radius:10px;font-size:14px;font-family:inherit;cursor:pointer;transition:all .15s;padding:0 20px;font-weight:400}
  #sendBtn{background:var(--accent-dim);border:1px solid var(--accent);color:var(--accent2)}
  #sendBtn:hover{background:rgba(111,183,255,.25)}
  #sendBtn:disabled{opacity:.4;cursor:not-allowed}
  #stopBtn{background:rgba(255,128,149,.1);border:1px solid rgba(255,128,149,.5);color:#ffb3c0}
  #stopBtn:hover{background:rgba(255,128,149,.2)}
  #attachBtn{flex-shrink:0;height:44px;width:44px;border-radius:10px;font-size:18px;background:var(--panel);border:1px solid var(--border2);color:var(--text2);cursor:pointer;transition:all .15s}
  #attachBtn:hover{color:var(--accent2);border-color:var(--accent)}
  .hint{max-width:840px;margin:8px auto 0;font-size:11px;color:var(--text3);text-align:center;font-family:var(--mono)}

  /* Toast */
  #toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(10px);background:var(--panel2);border:1px solid var(--border2);color:var(--text);padding:8px 18px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:all .25s;z-index:99;box-shadow:0 6px 24px rgba(0,0,0,.4)}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* 图片预览大图 */
  #lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:200;align-items:center;justify-content:center;cursor:zoom-out}
  #lightbox.show{display:flex}
  #lightbox img{max-width:92vw;max-height:92vh;border-radius:10px}

  @media (max-width:860px){
    #sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-105%);width:260px}
    #sidebar.open{transform:none;box-shadow:0 0 60px rgba(0,0,0,.6)}
    #menuBtn{display:block}
    #messages,#composer{padding-left:14px;padding-right:14px}
  }
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="diamond">◆</div>
      <div><h1>Qwen 聊天</h1><small>深圳城市职业学院 · 校园内网</small></div>
    </div>

    <button class="btn" id="newChatBtn">＋ 新建对话</button>

    <div id="convList"></div>

    <div class="settings">
      <div class="field">
        <label>模型</label>
        <select id="modelSelect"><option>qwen3.5-122b</option></select>
      </div>
      <div class="field">
        <label>系统提示词 <span class="val" id="spLen"></span></label>
        <textarea id="systemPrompt" placeholder="给模型设定身份或规则，可留空"></textarea>
      </div>
      <div class="field">
        <label>温度 <span class="val" id="tempVal">0.70</span></label>
        <input type="range" id="temperature" min="0" max="1.5" step="0.05" value="0.7">
      </div>
      <div class="field">
        <label>最大生成长度 <span class="val">tokens</span></label>
        <input type="number" id="maxTokens" min="256" max="32768" step="256" value="8192">
      </div>
      <label class="check"><input type="checkbox" id="thinkingToggle" checked> 深度思考（更慢但更稳）</label>
    </div>

    <div class="side-footer">
      API · 10.1.88.114:8001<br>
      仅校园网可达 · 本地代理 127.0.0.1:8000
    </div>
  </aside>

  <main>
    <header>
      <button id="menuBtn" title="菜单">☰</button>
      <div class="title">◆ <b id="headerModel">qwen3.5-122b</b> · 校园内网助手</div>
      <div class="hbtns">
        <button class="hbtn" id="themeBtn" title="切换明暗主题">🌙</button>
        <button class="hbtn" id="searchBtn" title="联网搜索（本地接口暂不支持）" disabled>🌐 搜索</button>
        <button class="hbtn" id="exportBtn" title="导出当前对话">导出</button>
      </div>
    </header>

    <div id="fileWarn">⚠️ 当前是直接双击打开的 HTML 文件，无法连接接口。请运行同目录下的 <b>start-chat.bat</b>，或访问 <b>http://localhost:8000</b> 使用。</div>

    <div id="messages"><div class="wrap" id="msgWrap"></div></div>

    <div id="composer">
      <div class="composer-inner">
        <div id="attachBar"></div>
        <div class="composer-row">
          <button id="attachBtn" title="添加图片/文件">📎</button>
          <textarea id="input" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行；可拖拽或粘贴图片"></textarea>
          <button id="sendBtn">发送</button>
          <button id="stopBtn" style="display:none">停止</button>
        </div>
        <div class="hint">Enter 发送 · Shift+Enter 换行 · 多会话/附件/导出 · 对话仅保存在本机浏览器</div>
      </div>
    </div>
  </main>
</div>
<div id="toast"></div>
<div id="lightbox"><img id="lightboxImg" alt="预览"></div>
<input type="file" id="fileInput" accept="image/*,.txt,.md,.json,.csv,.py,.js,.ts,.html,.css,.log" multiple style="display:none">

<script>
"use strict";
/* =====================================================================
 * Qwen 校园内网聊天页（网页版风格增强版）
 * 功能：多会话、流式+思考折叠、Markdown、附件(图片/文本)、重新生成、
 *      编辑/删除单条、导出、明暗主题、自动模型检测、状态排查。
 * 约定：本仓库由多个 AI 协作维护，提交时各自用 --author 区分。
 * ===================================================================== */

/* ===================== 常量与存储键 ===================== */
const LS_CONV = "qwenchat.conversations.v1";
const LS_SET  = "qwenchat.settings.v1";

/* ===================== 全局状态 ===================== */
const state = {
  conversations: {},   // id -> {id,title,messages:[],createdAt,updatedAt}
  order: [],           // 会话 id 顺序（最新在前）
  activeId: null,
  model: "qwen3.5-122b",
  streaming: false,
  abort: null,
  stick: true,
  attachments: [],     // 待发送附件 [{type:'image'|'file', name, dataUrl|text, size}]
};

const $ = id => document.getElementById(id);
const messagesEl = $("messages"), msgWrap = $("msgWrap"), inputEl = $("input");

/* ===================== 持久化 ===================== */
function loadAll(){
  try{
    const data = JSON.parse(localStorage.getItem(LS_CONV) || "{}");
    state.conversations = data.conversations || {};
    state.order = data.order || [];
  }catch(e){ state.conversations = {}; state.order = []; }
  if(!state.order.length) newConversation(true);
  else state.activeId = state.order[0];

  try{
    const s = JSON.parse(localStorage.getItem(LS_SET) || "{}");
    if(s.systemPrompt != null) $("systemPrompt").value = s.systemPrompt;

/* ===================== Markdown 渲染（先转义后格式化） ===================== */
function renderMarkdown(src){
  const codeBlocks = [];
  let text = String(src).replace(/```([\w-]*)\n?([\s\S]*?)(?:```|$)/g, (m, lang, code) => {
    codeBlocks.push({ lang: lang || "", code: code.replace(/\n+$/, "") });
    return "\u0000CB" + (codeBlocks.length - 1) + "\u0000";
  });
  text = escapeHtml(text);
  const inlines = [];
  text = text.replace(/`([^`\n]+)`/g, (m, c) => { inlines.push(c); return "\u0001I" + (inlines.length-1) + "\u0001"; });
  const inline = s => s
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*\w])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/~~([^~]+)~~/g, "<del>$1</del>")
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  const lines = text.split("\n");
  const out = []; let list = null; let para = [];
  const flushPara = () => { if(para.length){ out.push("<p>" + para.map(inline).join("<br>") + "</p>"); para = []; } };
  const flushList = () => { if(list){ out.push("<" + list.tag + ">" + list.items.map(i => "<li>" + inline(i) + "</li>").join("") + "</" + list.tag + ">"); list = null; } };
  for(const line of lines){
    const t = line.trim();
    if(/^\u0000CB\d+\u0000$/.test(t)){ flushPara(); flushList(); out.push("\u0002CB" + t.slice(3,-1) + "\u0002"); continue; }
    let m;
    if(m = line.match(/^(#{1,4})\s+(.*)/)){ flushPara(); flushList(); out.push("<h"+m[1].length+">"+inline(m[2])+"</h"+m[1].length+">"); continue; }
    if(/^\s*(---|\*\*\*|___)\s*$/.test(line)){ flushPara(); flushList(); out.push("<hr>"); continue; }
    if(m = line.match(/^>\s?(.*)/)){ flushPara(); flushList(); out.push("<blockquote>"+inline(m[1])+"</blockquote>"); continue; }
    if(m = line.match(/^\s*[-*+]\s+(.*)/)){ flushPara(); if(!list||list.tag!=="ul"){ flushList(); list={tag:"ul",items:[]}; } list.items.push(m[1]); continue; }
    if(m = line.match(/^\s*\d+[.、]\s*(.*)/)){ flushPara(); if(!list||list.tag!=="ol"){ flushList(); list={tag:"ol",items:[]}; } list.items.push(m[1]); continue; }
    if(t === ""){ flushPara(); flushList(); continue; }
    para.push(line);
  }
  flushPara(); flushList();
  return out.join("\n")
    .replace(/\u0002CB(\d+)\u0002/g, (m, i) => {
      const cb = codeBlocks[+i];
      return '<div class="codeblock"><div class="code-head"><span>'+escapeHtml(cb.lang||"code")+
        '</span><button data-copy="'+encodeURIComponent(cb.code)+'">复制</button></div>'+
        '<pre><code>'+escapeHtml(cb.code)+'</code></pre></div>';
    })
    .replace(/\u0001I(\d+)\u0001/g, (m, i) => '<code class="inline">'+inlines[+i]+'</code>');
}

}

/* ===================== 附件（图片/文本） ===================== */
function addAttachmentFromFile(file){
  const isImage = file.type.startsWith("image/");
  const reader = new FileReader();
  reader.onload = () => {
    if(isImage){
      downscaleImage(reader.result, 1280).then(dataUrl => {
        state.attachments.push({type:"image", name:file.name, dataUrl, size:file.size});
        renderAttachBar();
      });
    } else {
      state.attachments.push({type:"file", name:file.name, text:reader.result, size:file.size});
      renderAttachBar();
    }
  };
  if(isImage) reader.readAsDataURL(file);
  else reader.readAsText(file);
}
function downscaleImage(dataUrl, max){
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      if(w<=max && h<=max){ resolve(dataUrl); return; }
      const scale = max / Math.max(w,h); w = Math.round(w*scale); h = Math.round(h*scale);
      const cv = document.createElement("canvas"); cv.width=w; cv.height=h;
      cv.getContext("2d").drawImage(img,0,0,w,h);
      resolve(cv.toDataURL("image/jpeg",0.85));
    };
    img.onerror = () => resolve(dataUrl);
    img.src = dataUrl;
  });
}
function removeAttachment(i){ state.attachments.splice(i,1); renderAttachBar(); }
function renderAttachBar(){
  const bar = $("attachBar"); bar.innerHTML = "";
  if(!state.attachments.length){ bar.classList.remove("show"); return; }
  bar.classList.add("show");
  state.attachments.forEach((a, i) => {
    const el = document.createElement("div"); el.className="att";
    if(a.type==="image"){ const im=document.createElement("img"); im.src=a.dataUrl; el.appendChild(im); }
    const nm = document.createElement("span"); nm.className="nm";
    nm.textContent = (a.type==="image"?"🖼 ":"📄 ") + a.name; el.appendChild(nm);
    const rm = document.createElement("button"); rm.className="rm"; rm.textContent="✕";
    rm.onclick = () => removeAttachment(i); el.appendChild(rm);
    bar.appendChild(el);
  });
}

/* ===================== 构造请求体（多模态安全） ===================== */
function toApiContent(msg){
  if(msg.role === "assistant") return msg.content || "";
  if(msg.role === "user"){
    if(msg.parts && msg.parts.length){
      // 仅文本 parts → 合并成字符串（兜底，防止单文本数组触发 400）
      const hasNonText = msg.parts.some(p => p.type!=="text");
      if(!hasNonText) return msg.parts.map(p=>p.text||"").join("\n");
      return msg.parts.map(p => {
        if(p.type==="text") return {type:"text", text:p.text};
        if(p.type==="image") return {type:"image_url", image_url:{url:p.dataUrl}};
        if(p.type==="file") return {type:"text", text:"【文件 "+p.name+"】\n"+p.text};
        return {type:"text", text:""};
      });
    }
    return msg.content || "";
  }
  return msg.content || "";
}
function buildPayload(){
  const msgs = [];
  const sp = $("systemPrompt").value.trim();
  if(sp) msgs.push({role:"system", content:sp});
  activeConv().messages.forEach(m => {
    if(m.role==="user" || m.role==="assistant")
      msgs.push({role:m.role, content: toApiContent(m)});
  });
  return {
    model: state.model,
    messages: msgs,
    temperature: parseFloat($("temperature").value),
    max_tokens: parseInt($("maxTokens").value) || 8192,
    stream: true,
    chat_template_kwargs: {enable_thinking: $("thinkingToggle").checked},
  };
}

/* ===================== 发送与流式接收 ===================== */
let lastRender = 0;
async function send(){
  const text = inputEl.value.trim();
  if((!text && !state.attachments.length) || state.streaming) return;
  if(location.protocol === "file:"){ $("fileWarn").style.display="block"; return; }

  const c = activeConv();
  // 仅纯文字（无附件）时直接发字符串，避免单文本数组被后端拒绝 → 400
  let userMsg;
  if(state.attachments.length){
    const parts = [];
    if(text) parts.push({type:"text", text});
    state.attachments.forEach(a => parts.push(a.type==="image"
      ? {type:"image", name:a.name, dataUrl:a.dataUrl}
      : {type:"file", name:a.name, text:a.text}));
    userMsg = {role:"user", parts};
  } else {
    userMsg = {role:"user", content:text};
  }
  c.messages.push(userMsg);
  ensureTitle(c);
  saveConversations(); refreshEmpty(); addUserMsg(userMsg);
  inputEl.value=""; state.attachments=[]; renderAttachBar(); autoResize(); scrollToBottom();

  state.streaming = true; $("sendBtn").style.display="none"; $("stopBtn").style.display="block"; inputEl.focus();
  await streamAssistant(c, c.messages.length-1);
}

async function streamAssistant(c, assistantIdx){
  const {root, body} = makeMsgEl("assistant"); root.classList.add("streaming");
  let thinkDetails=null, thinkBody=null, reasoning="", content="";
  const bubble = document.createElement("div"); bubble.className="bubble";
  const ensureThink = () => {
    if(thinkDetails) return;
    thinkDetails=document.createElement("details"); thinkDetails.className="thinking";
    const s=document.createElement("summary"); s.textContent="思考过程…";
    thinkBody=document.createElement("div"); thinkBody.className="thinking-body";
    thinkDetails.appendChild(s); thinkDetails.appendChild(thinkBody);
    body.insertBefore(thinkDetails, bubble);
  };
  const paint = (force) => {
    const now = performance.now(); if(!force && now-lastRender<70) return; lastRender=now;
    if(reasoning && thinkBody){ thinkBody.textContent=reasoning; thinkDetails.querySelector("summary").textContent="思考过程 · "+reasoning.length+" 字"; }
    bubble.innerHTML = '<div class="md">'+renderMarkdown(content)+'</div>';
    if(state.stick) scrollToBottom();
  };
  body.appendChild(bubble);
  root.querySelector(".who").appendChild(document.createDocumentFragment());
  msgWrap.appendChild(root); scrollToBottom();
  state.abort = new AbortController();

  const finish = (stopped) => {
    state.streaming=false; state.abort=null;
    root.classList.remove("streaming");
    $("sendBtn").style.display="block"; $("stopBtn").style.display="none";
    paint(true);
    const finalContent = (content || "（无内容）") + (stopped ? "\n\n*（已停止生成）*" : "");
    const msgObj = {role:"assistant", content:finalContent, reasoning:reasoning||""};
    c.messages[assistantIdx] = msgObj; msgObj._idx = assistantIdx;
    root.querySelector(".who").appendChild(buildMsgActions(msgObj, assistantIdx));
    saveConversations(); refreshEmpty();
    if(state.stick) scrollToBottom();
  };

  try{
    let payload = buildPayload();
    let resp = await fetch("/v1/chat/completions", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(payload), signal:state.abort.signal});
    if(resp.status===400){
      const errText = await resp.clone().text();
      if(/chat_template_kwargs|enable_thinking/i.test(errText)){ delete payload.chat_template_kwargs;
        resp = await fetch("/v1/chat/completions", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(payload), signal:state.abort.signal}); }
    }
    if(!resp.ok){ let d="HTTP "+resp.status; try{ d+=" · "+(await resp.text()).slice(0,200); }catch(e){} throw new Error(d); }

    const reader = resp.body.getReader(); const decoder = new TextDecoder("utf-8"); let buf="";
    const handleEvent = raw => {
      for(const line of raw.split("\n")){
        const t=line.trim(); if(!t.startsWith("data:")) continue;
        const data=t.slice(5).trim(); if(data==="[DONE]") return;
        let j; try{ j=JSON.parse(data); }catch(e){ continue; }
        const delta=j.choices&&j.choices[0]&&j.choices[0].delta; if(!delta) continue;
        if(delta.reasoning){ reasoning+=delta.reasoning; ensureThink(); }
        if(delta.content){ if(reasoning&&thinkDetails&&thinkDetails.open) thinkDetails.open=false; content+=delta.content; }
        paint(false);
      }
    };
    while(true){ const {done,value}=await reader.read(); if(done) break;
      buf+=decoder.decode(value,{stream:true}); let i; while((i=buf.indexOf("\n\n"))>=0){ handleEvent(buf.slice(0,i)); buf=buf.slice(i+2); } }
    if(buf.trim()) handleEvent(buf);
    finish(false);
  }catch(err){
    if(err && err.name==="AbortError"){ finish(true); return; }
    const offline = !navigator.onLine || /failed|network|load/i.test(String(err));
    addErrorMsg("请求失败："+escapeHtml(String(err && err.message || err)) +
      (offline ? "<br><br>可能原因：<br>1. 未连接校园网（仅校内可达）<br>2. 推理服务 10.1.88.114:8001 不在线<br>3. 本地代理未启动——请运行 start-chat.bat" : ""));
    state.streaming=false; state.abort=null;
    root.classList.remove("streaming");
    $("sendBtn").style.display="block"; $("stopBtn").style.display="none";
    if(!content && !reasoning) root.remove();
    else finish(false);
  }
}

/* ===================== 重新生成 ===================== */
async function regenerate(assistantIdx){
  const c = activeConv();
  if(state.streaming) return toast("生成中，请先停止");
  if(c.messages[assistantIdx] && c.messages[assistantIdx].role==="assistant"){
    c.messages = c.messages.slice(0, assistantIdx);
    saveConversations(); renderMessages(); refreshEmpty();
    state.streaming=true; $("sendBtn").style.display="none"; $("stopBtn").style.display="block";
    await streamAssistant(c, c.messages.length);
  }
}

  streamAssistant(c, c.messages.length-1);
}

  c.messages.forEach(m => {
    if(m.role==="user"){ md += "## 我\n\n"+userTextOf(m)+"\n\n"; }
    else { if(m.reasoning) md += "**思考过程：**\n\n"+m.reasoning+"\n\n"; md += "## Qwen3.5\n\n"+(m.content||"")+"\n\n"; }
  });
  const blob = new Blob([md], {type:"text/markdown;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = (c.title||"qwen对话").replace(/[\\/:*?"<>|]/g,"_")+".md";
  a.click(); URL.revokeObjectURL(a.href);
  toast("已导出 Markdown");
}

/* ===================== 主题 ===================== */
function syncThemeBtn(){
  const t = document.documentElement.getAttribute("data-theme");
  $("themeBtn").textContent = (t==="light") ? "☀️" : "🌙";
}
function toggleTheme(){
  const cur = document.documentElement.getAttribute("data-theme");
  const next = cur==="light" ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", next);
  syncThemeBtn(); saveSettings();
}

/* ===================== 输入与控件 ===================== */
function autoResize(){ inputEl.style.height="auto"; inputEl.style.height=Math.min(inputEl.scrollHeight,180)+"px"; }
inputEl.addEventListener("input", autoResize);
inputEl.addEventListener("keydown", e => { if(e.key==="Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); send(); } });
$("sendBtn").onclick = send;
$("stopBtn").onclick = () => { if(state.abort) state.abort.abort(); };
$("attachBtn").onclick = () => $("fileInput").click();
$("fileInput").onchange = e => { [...e.target.files].forEach(addAttachmentFromFile); e.target.value=""; };
composer.addEventListener("dragover", e => { e.preventDefault(); composer.style.outline="1px dashed var(--accent)"; });
composer.addEventListener("dragleave", () => { composer.style.outline=""; });
composer.addEventListener("drop", e => { e.preventDefault(); composer.style.outline="";
  [...(e.dataTransfer.files||[])].forEach(addAttachmentFromFile); });
inputEl.addEventListener("paste", e => {
  [...(e.clipboardData.files||[])].forEach(f => { if(f.type.startsWith("image/")) addAttachmentFromFile(f); });
});
$("newChatBtn").onclick = () => newConversation(false);
$("themeBtn").onclick = toggleTheme;
$("exportBtn").onclick = exportConversation;
$("searchBtn").onclick = () => toast("本地部署接口暂不支持联网搜索");

function syncTemp(){ $("tempVal").textContent = parseFloat($("temperature").value).toFixed(2); }
function syncSpLen(){ $("spLen").textContent = $("systemPrompt").value.length + " 字"; }
["systemPrompt","temperature","maxTokens","thinkingToggle"].forEach(id =>
  $(id).addEventListener("change", () => { syncTemp(); syncSpLen(); saveSettings(); }));
$("temperature").addEventListener("input", syncTemp);
$("systemPrompt").addEventListener("input", syncSpLen);
$("modelSelect").addEventListener("change", () => { state.model=$("modelSelect").value; saveSettings(); });
$("menuBtn").onclick = () => $("sidebar").classList.toggle("open");
messagesEl.addEventListener("click", e => {
  const btn = e.target.closest("button[data-copy]");
  if(btn) copyText(decodeURIComponent(btn.dataset.copy), btn);
});

/* 图片大图预览 */
function openLightbox(src){ $("lightboxImg").src=src; $("lightbox").classList.add("show"); }
$("lightbox").onclick = () => $("lightbox").classList.remove("show");

/* ===================== 启动 ===================== */
loadAll();
if(location.protocol === "file:") $("fileWarn").style.display="block";
renderConvList(); renderMessages(); refreshEmpty();
checkStatus(); autoResize();
</script>
</body>
</html>
