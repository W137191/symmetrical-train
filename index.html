<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qwen 聊天 · 校园内网</title>
<style>
  :root{
    --bg:#0a0f1e; --bg2:#0c1424; --panel:#101a30; --panel2:#14203a;
    --border:rgba(150,185,255,.14); --border2:rgba(150,185,255,.26);
    --text:#e9effc; --text2:#9aabd0; --text3:#5f7099;
    --accent:#6fb7ff; --accent2:#9ccfff; --accent-dim:rgba(111,183,255,.13);
    --danger:#ff8095; --ok:#5fe3a1;
    --mono:"Cascadia Code","JetBrains Mono",Consolas,"Courier New",monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--text);
    font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
    font-weight:300;font-size:15px;line-height:1.65;overflow:hidden;
  }
  #app{display:flex;height:100vh}

  /* ============ 侧栏 ============ */
  #sidebar{
    width:272px;flex-shrink:0;height:100%;display:flex;flex-direction:column;
    background:linear-gradient(180deg,var(--bg2),var(--bg));
    border-right:1px solid var(--border);padding:18px 16px;gap:14px;
    transition:transform .25s ease;z-index:20;
  }
  .brand{display:flex;align-items:center;gap:10px;padding:2px 4px}
  .brand .diamond{
    width:30px;height:30px;flex-shrink:0;display:grid;place-items:center;
    border:1px solid var(--border2);border-radius:8px;color:var(--accent);
    font-size:14px;background:var(--accent-dim);
    box-shadow:0 0 14px rgba(111,183,255,.18) inset;
  }
  .brand h1{font-size:16px;font-weight:400;letter-spacing:.5px}
  .brand small{display:block;font-size:11px;color:var(--text3);font-weight:300}

  .status{
    display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text2);
    padding:8px 10px;border:1px solid var(--border);border-radius:8px;
    background:rgba(255,255,255,.02);cursor:pointer;user-select:none;
  }
  .status:hover{border-color:var(--border2)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--text3);flex-shrink:0}
  .dot.ok{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  .dot.fail{background:var(--danger);box-shadow:0 0 8px var(--danger)}
  .dot.checking{background:#ffd479;animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.35}}

  .btn{
    appearance:none;border:1px solid var(--border2);background:var(--accent-dim);
    color:var(--accent2);border-radius:8px;padding:9px 12px;font-size:13.5px;
    font-family:inherit;font-weight:400;cursor:pointer;transition:all .15s;
  }
  .btn:hover{background:rgba(111,183,255,.22);border-color:var(--accent)}

  .settings{display:flex;flex-direction:column;gap:14px;overflow-y:auto;flex:1;padding-right:2px}
  .settings::-webkit-scrollbar{width:4px}
  .settings::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-size:12px;color:var(--text2);letter-spacing:.3px;display:flex;justify-content:space-between}
  .field label .val{color:var(--accent2);font-family:var(--mono);font-size:11px}
  textarea,input[type=number],select{
    background:rgba(255,255,255,.03);border:1px solid var(--border);
    border-radius:8px;color:var(--text);padding:8px 10px;font-size:13px;
    font-family:inherit;font-weight:300;outline:none;transition:border .15s;width:100%;
  }
  textarea:focus,input:focus,select:focus{border-color:var(--accent)}
  textarea{resize:vertical;min-height:64px}
  select option{background:var(--panel)}
  input[type=range]{width:100%;accent-color:var(--accent);cursor:pointer}
  .check{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text2);cursor:pointer;user-select:none}
  .check input{accent-color:var(--accent);width:15px;height:15px;cursor:pointer}

  .side-footer{
    font-size:11px;color:var(--text3);border-top:1px solid var(--border);
    padding-top:12px;line-height:1.7;font-family:var(--mono);
  }

  /* ============ 主区 ============ */
  main{flex:1;display:flex;flex-direction:column;min-width:0;height:100%}
  header{
    display:flex;align-items:center;gap:12px;padding:12px 20px;
    border-bottom:1px solid var(--border);background:rgba(10,15,30,.7);
    backdrop-filter:blur(6px);
  }
  #menuBtn{display:none;background:none;border:none;color:var(--text2);font-size:20px;cursor:pointer}
  header .title{font-size:14.5px;font-weight:400;letter-spacing:.4px;flex:1;min-width:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header .title b{color:var(--accent2);font-weight:400}
  #msgCount{font-size:12px;color:var(--text3);font-family:var(--mono)}

  #fileWarn{
    display:none;margin:10px 20px 0;padding:10px 14px;border:1px solid rgba(255,128,149,.4);
    background:rgba(255,128,149,.08);color:#ffb3c0;border-radius:8px;font-size:13px;
  }

  /* ============ 消息区 ============ */
  #messages{flex:1;overflow-y:auto;padding:24px 20px 12px;scroll-behavior:auto}
  #messages::-webkit-scrollbar{width:6px}
  #messages::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
  .wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

  .empty{text-align:center;padding:60px 20px;color:var(--text3)}
  .empty .big{font-size:40px;color:var(--accent);opacity:.85;margin-bottom:14px;
    text-shadow:0 0 24px rgba(111,183,255,.5)}
  .empty h2{font-size:18px;font-weight:400;color:var(--text2);margin-bottom:8px}
  .empty p{font-size:13px;margin-bottom:26px}
  .chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
  .chip{
    border:1px solid var(--border2);background:rgba(255,255,255,.02);color:var(--text2);
    border-radius:999px;padding:7px 16px;font-size:13px;cursor:pointer;transition:all .15s;font-family:inherit;
  }
  .chip:hover{color:var(--accent2);border-color:var(--accent);background:var(--accent-dim)}

  .msg{display:flex;gap:10px;animation:fadeUp .25s ease}
  @keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .msg .avatar{
    width:30px;height:30px;flex-shrink:0;border-radius:8px;display:grid;place-items:center;
    font-size:13px;border:1px solid var(--border2);margin-top:2px;
  }
  .msg.user .avatar{color:var(--text2);background:rgba(255,255,255,.03)}
  .msg.assistant .avatar{color:var(--accent);background:var(--accent-dim);
    box-shadow:0 0 12px rgba(111,183,255,.15) inset}
  .msg .body{min-width:0;flex:1;display:flex;flex-direction:column;gap:6px}
  .msg .who{font-size:11px;color:var(--text3);letter-spacing:.5px}
  .bubble{
    border-radius:10px;padding:12px 16px;font-size:14.5px;word-wrap:break-word;overflow-wrap:anywhere;
  }
  .msg.user .bubble{
    background:linear-gradient(135deg,rgba(30,64,140,.55),rgba(40,80,160,.4));
    border:1px solid rgba(111,183,255,.28);
  }
  .msg.assistant .bubble{background:var(--panel);border:1px solid var(--border)}
  .msg.error .bubble{background:rgba(255,128,149,.07);border:1px solid rgba(255,128,149,.35);color:#ffb3c0}
  .msg.error .avatar{color:var(--danger);border-color:rgba(255,128,149,.4)}

  .msg-actions{display:flex;gap:6px;opacity:0;transition:opacity .15s}
  .msg:hover .msg-actions,.msg.assistant .msg-actions{opacity:1}
  .act{
    background:none;border:1px solid var(--border);color:var(--text3);border-radius:6px;
    font-size:11px;padding:3px 10px;cursor:pointer;font-family:inherit;transition:all .15s;
  }
  .act:hover{color:var(--accent2);border-color:var(--accent)}

  .thinking{
    border:1px solid var(--border);border-left:2px solid var(--accent);
    border-radius:8px;background:rgba(111,183,255,.045);font-size:13px;overflow:hidden;
  }
  .thinking summary{
    cursor:pointer;padding:7px 14px;color:var(--text3);font-size:12px;
    user-select:none;list-style:none;display:flex;align-items:center;gap:6px;
  }
  .thinking summary::-webkit-details-marker{display:none}
  .thinking summary::before{content:"▸";transition:transform .15s;font-size:10px}
  .thinking[open] summary::before{transform:rotate(90deg)}
  .thinking summary:hover{color:var(--text2)}
  .thinking-body{
    padding:4px 14px 12px;color:var(--text3);white-space:pre-wrap;
    font-size:12.5px;line-height:1.6;max-height:300px;overflow-y:auto;
    border-top:1px dashed var(--border);
  }

  /* Markdown 内容 */
  .md p{margin:.45em 0}
  .md p:first-child{margin-top:0}.md p:last-child{margin-bottom:0}
  .md h1,.md h2,.md h3,.md h4{font-weight:500;margin:.8em 0 .4em;line-height:1.4}
  .md h1{font-size:1.25em}.md h2{font-size:1.15em}.md h3{font-size:1.05em}.md h4{font-size:1em}
  .md ul,.md ol{margin:.4em 0;padding-left:1.5em}
  .md li{margin:.2em 0}
  .md blockquote{
    border-left:2px solid var(--accent);padding:2px 12px;margin:.5em 0;
    color:var(--text2);background:rgba(111,183,255,.05);border-radius:0 6px 6px 0;
  }
  .md hr{border:none;border-top:1px solid var(--border);margin:.9em 0}
  .md a{color:var(--accent2);text-decoration:none;border-bottom:1px dotted var(--accent)}
  .md a:hover{color:var(--accent)}
  .md code.inline{
    font-family:var(--mono);font-size:.88em;background:rgba(111,183,255,.1);
    border:1px solid var(--border);border-radius:4px;padding:1px 5px;color:var(--accent2);
  }
  .codeblock{border:1px solid var(--border);border-radius:8px;overflow:hidden;margin:.6em 0;background:#070c18}
  .code-head{
    display:flex;justify-content:space-between;align-items:center;padding:5px 12px;
    background:rgba(255,255,255,.03);border-bottom:1px solid var(--border);
    font-size:11px;color:var(--text3);font-family:var(--mono);
  }
  .code-head button{
    background:none;border:1px solid var(--border);color:var(--text3);border-radius:5px;
    font-size:10.5px;padding:2px 9px;cursor:pointer;font-family:inherit;
  }
  .code-head button:hover{color:var(--accent2);border-color:var(--accent)}
  .codeblock pre{padding:12px 14px;overflow-x:auto}
  .codeblock pre::-webkit-scrollbar{height:6px}
  .codeblock pre::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
  .codeblock code{font-family:var(--mono);font-size:12.5px;line-height:1.6;color:#c9d8f5}

  .streaming .bubble::after{
    content:"▍";color:var(--accent);animation:blink 1s infinite;margin-left:1px;
  }
  @keyframes blink{50%{opacity:0}}

  /* ============ 输入区 ============ */
  #composer{border-top:1px solid var(--border);padding:14px 20px 16px;background:rgba(10,15,30,.6)}
  .composer-inner{max-width:820px;margin:0 auto;display:flex;gap:10px;align-items:flex-end}
  #input{
    flex:1;background:var(--panel);border:1px solid var(--border2);border-radius:10px;
    color:var(--text);padding:11px 14px;font-size:14.5px;font-family:inherit;font-weight:300;
    line-height:1.5;resize:none;outline:none;max-height:168px;transition:border .15s;
  }
  #input:focus{border-color:var(--accent)}
  #input::placeholder{color:var(--text3)}
  #sendBtn,#stopBtn{
    flex-shrink:0;height:42px;border-radius:10px;font-size:14px;font-family:inherit;
    cursor:pointer;transition:all .15s;padding:0 20px;font-weight:400;
  }
  #sendBtn{background:var(--accent-dim);border:1px solid var(--accent);color:var(--accent2)}
  #sendBtn:hover{background:rgba(111,183,255,.25)}
  #sendBtn:disabled{opacity:.4;cursor:not-allowed}
  #stopBtn{background:rgba(255,128,149,.1);border:1px solid rgba(255,128,149,.5);color:#ffb3c0}
  #stopBtn:hover{background:rgba(255,128,149,.2)}
  .hint{max-width:820px;margin:8px auto 0;font-size:11px;color:var(--text3);text-align:center;font-family:var(--mono)}

  /* Toast */
  #toast{
    position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(10px);
    background:var(--panel2);border:1px solid var(--border2);color:var(--text);
    padding:8px 18px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;
    transition:all .25s;z-index:99;box-shadow:0 6px 24px rgba(0,0,0,.4);
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* 移动端 */
  @media (max-width:860px){
    #sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-105%)}
    #sidebar.open{transform:none;box-shadow:0 0 60px rgba(0,0,0,.6)}
    #menuBtn{display:block}
    #messages,#composer{padding-left:14px;padding-right:14px}
  }
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="diamond">◆</div>
      <div>
        <h1>Qwen 聊天</h1>
        <small>深圳城市职业学院 · 校园内网</small>
      </div>
    </div>

    <div class="status" id="statusBox" title="点击重新检测">
      <span class="dot checking" id="statusDot"></span>
      <span id="statusText">正在检测服务…</span>
    </div>

    <button class="btn" id="newChatBtn">＋ 新对话</button>

    <div class="settings">
      <div class="field">
        <label>模型</label>
        <select id="modelSelect"><option>qwen3.5-122b</option></select>
      </div>
      <div class="field">
        <label>系统提示词 <span class="val" id="spLen"></span></label>
        <textarea id="systemPrompt" placeholder="给模型设定身份或规则，可留空"></textarea>
      </div>
      <div class="field">
        <label>温度 <span class="val" id="tempVal">0.70</span></label>
        <input type="range" id="temperature" min="0" max="1.5" step="0.05" value="0.7">
      </div>
      <div class="field">
        <label>最大生成长度 <span class="val">tokens</span></label>
        <input type="number" id="maxTokens" min="256" max="32768" step="256" value="8192">
      </div>
      <label class="check"><input type="checkbox" id="thinkingToggle" checked> 深度思考（更慢但更稳）</label>
    </div>

    <div class="side-footer">
      API · 10.1.88.114:8001<br>
      仅校园网可达 · 本地代理 127.0.0.1:8000
    </div>
  </aside>

  <main>
    <header>
      <button id="menuBtn" title="菜单">☰</button>
      <div class="title">◆ <b id="headerModel">qwen3.5-122b</b> · 校园内网助手</div>
      <span id="msgCount"></span>
    </header>

    <div id="fileWarn">⚠️ 当前是直接双击打开的 HTML 文件，无法连接接口。请运行同目录下的 <b>start-chat.bat</b>，或访问 <b>http://localhost:8000</b> 使用。</div>

    <div id="messages"><div class="wrap" id="msgWrap"></div></div>

    <div id="composer">
      <div class="composer-inner">
        <textarea id="input" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
        <button id="sendBtn">发送</button>
        <button id="stopBtn" style="display:none">停止</button>
      </div>
      <div class="hint">Enter 发送 · Shift+Enter 换行 · 对话记录仅保存在本机浏览器</div>
    </div>
  </main>
</div>
<div id="toast"></div>

<script>
"use strict";
/* ================= 状态与持久化 ================= */
const LS_MSG = "qwenchat.messages.v1";
const LS_SET = "qwenchat.settings.v1";

const state = {
  messages: [],        // {role, content, reasoning?}
  model: "qwen3.5-122b",
  streaming: false,
  abort: null,
  stick: true,
};

const $ = id => document.getElementById(id);
const messagesEl = $("messages"), msgWrap = $("msgWrap"), inputEl = $("input");

function loadAll(){
  try{
    const m = JSON.parse(localStorage.getItem(LS_MSG) || "[]");
    if(Array.isArray(m)) state.messages = m.slice(-60);
  }catch(e){}
  try{
    const s = JSON.parse(localStorage.getItem(LS_SET) || "{}");
    if(s.systemPrompt) $("systemPrompt").value = s.systemPrompt;
    if(s.temperature) $("temperature").value = s.temperature;
    if(s.maxTokens) $("maxTokens").value = s.maxTokens;
    if(typeof s.thinking === "boolean") $("thinkingToggle").checked = s.thinking;
    if(s.model) state.model = s.model;
  }catch(e){}
  syncTemp(); syncSpLen();
}
function saveSettings(){
  localStorage.setItem(LS_SET, JSON.stringify({
    systemPrompt: $("systemPrompt").value,
    temperature: $("temperature").value,
    maxTokens: $("maxTokens").value,
    thinking: $("thinkingToggle").checked,
    model: state.model,
  }));
}
function saveMessages(){
  try{ localStorage.setItem(LS_MSG, JSON.stringify(state.messages.slice(-60))); }catch(e){}
}

/* ================= 工具 ================= */
function escapeHtml(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
let toastTimer = null;
function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove("show"), 1600);
}
async function copyText(text, btn){
  try{ await navigator.clipboard.writeText(text); }
  catch(e){
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); ta.remove();
  }
  if(btn){ const o = btn.textContent; btn.textContent = "已复制"; setTimeout(()=>btn.textContent=o, 1200); }
  else toast("已复制到剪贴板");
}

/* ================= Markdown 渲染（安全：先转义后格式化） ================= */
function renderMarkdown(src){
  const codeBlocks = [];
  let text = String(src).replace(/```([\w-]*)\n?([\s\S]*?)(?:```|$)/g, (m, lang, code) => {
    codeBlocks.push({ lang: lang || "", code: code.replace(/\n+$/, "") });
    return "\u0000CB" + (codeBlocks.length - 1) + "\u0000";
  });
  text = escapeHtml(text);
  const inlines = [];
  text = text.replace(/`([^`\n]+)`/g, (m, c) => {
    inlines.push(c); return "\u0001I" + (inlines.length - 1) + "\u0001";
  });
  const inline = s => s
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*\w])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/~~([^~]+)~~/g, "<del>$1</del>")
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  const lines = text.split("\n");
  const out = []; let list = null; let para = [];
  const flushPara = () => { if(para.length){ out.push("<p>" + para.map(inline).join("<br>") + "</p>"); para = []; } };
  const flushList = () => { if(list){ out.push("<" + list.tag + ">" + list.items.map(i => "<li>" + inline(i) + "</li>").join("") + "</" + list.tag + ">"); list = null; } };
  for(const line of lines){
    const t = line.trim();
    if(/^\u0000CB\d+\u0000$/.test(t)){ flushPara(); flushList(); out.push("\u0002CB" + t.slice(3, -1) + "\u0002"); continue; }
    let m;
    if(m = line.match(/^(#{1,4})\s+(.*)/)){ flushPara(); flushList();
      out.push("<h" + m[1].length + ">" + inline(m[2]) + "</h" + m[1].length + ">"); continue; }
    if(/^\s*(---|\*\*\*|___)\s*$/.test(line)){ flushPara(); flushList(); out.push("<hr>"); continue; }
    if(m = line.match(/^>\s?(.*)/)){ flushPara(); flushList(); out.push("<blockquote>" + inline(m[1]) + "</blockquote>"); continue; }
    if(m = line.match(/^\s*[-*+]\s+(.*)/)){ flushPara();
      if(!list || list.tag !== "ul"){ flushList(); list = {tag:"ul", items:[]}; }
      list.items.push(m[1]); continue; }
    if(m = line.match(/^\s*\d+[.、]\s*(.*)/)){ flushPara();
      if(!list || list.tag !== "ol"){ flushList(); list = {tag:"ol", items:[]}; }
      list.items.push(m[1]); continue; }
    if(t === ""){ flushPara(); flushList(); continue; }
    para.push(line);
  }
  flushPara(); flushList();
  return out.join("\n")
    .replace(/\u0002CB(\d+)\u0002/g, (m, i) => {
      const cb = codeBlocks[+i];
      return '<div class="codeblock"><div class="code-head"><span>' + escapeHtml(cb.lang || "code") +
        '</span><button data-copy="' + encodeURIComponent(cb.code) + '">复制</button></div>' +
        '<pre><code>' + escapeHtml(cb.code) + '</code></pre></div>';
    })
    .replace(/\u0001I(\d+)\u0001/g, (m, i) => '<code class="inline">' + inlines[+i] + '</code>');
}

/* ================= 消息渲染 ================= */
function scrollToBottom(){ messagesEl.scrollTop = messagesEl.scrollHeight; }
messagesEl.addEventListener("scroll", () => {
  state.stick = messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 90;
});

function makeMsgEl(role){
  const div = document.createElement("div");
  div.className = "msg " + role;
  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = role === "user" ? "你" : "◆";
  const body = document.createElement("div");
  body.className = "body";
  const who = document.createElement("div");
  who.className = "who";
  who.textContent = role === "user" ? "我" : (role === "error" ? "系统" : "Qwen3.5");
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  body.appendChild(who); body.appendChild(bubble);
  div.appendChild(avatar); div.appendChild(body);
  return {root: div, bubble};
}

function addUserMsg(text){
  const {root, bubble} = makeMsgEl("user");
  bubble.innerHTML = '<div class="md">' + renderMarkdown(text) + "</div>";
  msgWrap.appendChild(root);
}
function addErrorMsg(html){
  const {root, bubble} = makeMsgEl("error");
  bubble.innerHTML = html;
  msgWrap.appendChild(root);
  scrollToBottom();
}

function renderHistory(){
  msgWrap.innerHTML = "";
  if(!state.messages.length){ showEmpty(); return; }
  for(const m of state.messages){
    if(m.role === "user"){ addUserMsg(m.content); continue; }
    const {root, bubble} = makeMsgEl("assistant");
    root.appendChild(buildThinking(m.reasoning || ""));
    bubble.innerHTML = '<div class="md">' + renderMarkdown(m.content || "") + "</div>";
    const acts = buildActions(m.content || "");
    root.querySelector(".body").appendChild(acts);
    msgWrap.appendChild(root);
  }
  scrollToBottom();
}

function buildThinking(reasoning){
  if(!reasoning || !reasoning.trim()) return document.createDocumentFragment();
  const d = document.createElement("details");
  d.className = "thinking";
  const s = document.createElement("summary");
  s.textContent = "思考过程 · " + reasoning.length + " 字";
  const b = document.createElement("div");
  b.className = "thinking-body";
  b.textContent = reasoning;
  d.appendChild(s); d.appendChild(b);
  return d;
}
function buildActions(text){
  const wrap = document.createElement("div");
  wrap.className = "msg-actions";
  const cp = document.createElement("button");
  cp.className = "act"; cp.textContent = "复制";
  cp.onclick = () => copyText(text, cp);
  wrap.appendChild(cp);
  return wrap;
}

function showEmpty(){
  const d = document.createElement("div");
  d.className = "empty";
  d.innerHTML =
    '<div class="big">◆</div><h2>你好，我是 Qwen3.5-122B</h2>' +
    "<p>基于校园内网推理服务 · 仅校内可达</p>";
  const chips = document.createElement("div");
  chips.className = "chips";
  [
    "帮我看看这段代码有什么问题",
    "用新生能听懂的话解释一下什么是 API",
    "帮我把这段话改写得更有条理",
  ].forEach(txt => {
    const c = document.createElement("button");
    c.className = "chip"; c.textContent = txt;
    c.onclick = () => { inputEl.value = txt; autoResize(); inputEl.focus(); };
    chips.appendChild(c);
  });
  d.appendChild(chips);
  msgWrap.appendChild(d);
}
function refreshEmpty(){
  const has = msgWrap.querySelector(".empty");
  if(!state.messages.length && !state.streaming && !has) showEmpty();
  if(state.messages.length && has) has.remove();
  $("msgCount").textContent = state.messages.length ? state.messages.length + " 条对话" : "";
}

/* ================= 服务状态 ================= */
async function checkStatus(){
  const dot = $("statusDot"), txt = $("statusText");
  dot.className = "dot checking"; txt.textContent = "正在检测服务…";
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 8000);
  try{
    const r = await fetch("/v1/models", {signal: ctrl.signal});
    if(!r.ok) throw new Error("HTTP " + r.status);
    const data = await r.json();
    const ids = (data.data || []).map(m => m.id);
    if(ids.length && ![...$("modelSelect").options].some(o => o.value === ids[0])){
      $("modelSelect").innerHTML = "";
      ids.forEach(id => {
        const o = document.createElement("option");
        o.value = id; o.textContent = id; $("modelSelect").appendChild(o);
      });
    }
    if(ids.length) $("modelSelect").value = state.model && ids.includes(state.model) ? state.model : ids[0];
    state.model = $("modelSelect").value;
    $("headerModel").textContent = state.model;
    dot.className = "dot ok";
    txt.textContent = "在线 · " + state.model;
  }catch(e){
    dot.className = "dot fail";
    txt.textContent = "离线 · 请检查校园网或服务状态";
  }finally{ clearTimeout(timer); }
}
$("statusBox").onclick = checkStatus;

/* ================= 发送与流式接收 ================= */
function buildPayload(){
  const msgs = [];
  const sp = $("systemPrompt").value.trim();
  if(sp) msgs.push({role: "system", content: sp});
  state.messages.forEach(m => {
    if(m.role === "user" || m.role === "assistant")
      msgs.push({role: m.role, content: m.content});
  });
  return {
    model: state.model,
    messages: msgs,
    temperature: parseFloat($("temperature").value),
    max_tokens: parseInt($("maxTokens").value) || 8192,
    stream: true,
    chat_template_kwargs: {enable_thinking: $("thinkingToggle").checked},
  };
}

let lastRender = 0;
async function send(){
  const text = inputEl.value.trim();
  if(!text || state.streaming) return;
  if(location.protocol === "file:"){ $("fileWarn").style.display = "block"; return; }

  state.messages.push({role: "user", content: text});
  saveMessages(); refreshEmpty(); addUserMsg(text);
  inputEl.value = ""; autoResize();
  scrollToBottom();

  state.streaming = true;
  $("sendBtn").style.display = "none";
  $("stopBtn").style.display = "block";
  inputEl.focus();

  const {root, bubble} = makeMsgEl("assistant");
  root.classList.add("streaming");
  let thinkDetails = null, thinkBody = null;
  let reasoning = "", content = "";
  const ensureThink = () => {
    if(thinkDetails) return;
    thinkDetails = document.createElement("details");
    thinkDetails.className = "thinking";
    const s = document.createElement("summary");
    s.textContent = "思考过程…";
    thinkBody = document.createElement("div");
    thinkBody.className = "thinking-body";
    thinkDetails.appendChild(s); thinkDetails.appendChild(thinkBody);
    root.querySelector(".body").insertBefore(thinkDetails, bubble);
  };
  const paint = (force) => {
    const now = performance.now();
    if(!force && now - lastRender < 70) return;
    lastRender = now;
    if(reasoning && thinkBody){
      thinkBody.textContent = reasoning;
      thinkDetails.querySelector("summary").textContent = "思考过程 · " + reasoning.length + " 字";
    }
    bubble.innerHTML = '<div class="md">' + renderMarkdown(content) + "</div>";
    if(state.stick) scrollToBottom();
  };
  msgWrap.appendChild(root); scrollToBottom();

  state.abort = new AbortController();
  const finish = (stopped) => {
    state.streaming = false; state.abort = null;
    root.classList.remove("streaming");
    $("sendBtn").style.display = "block";
    $("stopBtn").style.display = "none";
    paint(true);
    state.messages.push({
      role: "assistant",
      content: (content || "（无内容）") + (stopped ? "\n\n*（已停止生成）*" : ""),
      reasoning: reasoning || "",
    });
    saveMessages(); refreshEmpty();
    if(state.stick) scrollToBottom();
  };

  try{
    let payload = buildPayload();
    let resp = await fetch("/v1/chat/completions", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(payload),
      signal: state.abort.signal,
    });
    if(resp.status === 400){
      const errText = await resp.clone().text();
      if(/chat_template_kwargs|enable_thinking/i.test(errText)){
        delete payload.chat_template_kwargs;
        resp = await fetch("/v1/chat/completions", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify(payload),
          signal: state.abort.signal,
        });
      }
    }
    if(!resp.ok){
      let d = "HTTP " + resp.status;
      try{ d += " · " + (await resp.text()).slice(0, 200); }catch(e){}
      throw new Error(d);
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder("utf-8");
    let buf = "";
    const handleEvent = raw => {
      for(const line of raw.split("\n")){
        const t = line.trim();
        if(!t.startsWith("data:")) continue;
        const data = t.slice(5).trim();
        if(data === "[DONE]") return;
        let j; try{ j = JSON.parse(data); }catch(e){ continue; }
        const delta = j.choices && j.choices[0] && j.choices[0].delta;
        if(!delta) continue;
        if(delta.reasoning){ reasoning += delta.reasoning; ensureThink(); }
        if(delta.content){
          if(reasoning && thinkDetails && thinkDetails.open) thinkDetails.open = false;
          content += delta.content;
        }
        paint(false);
      }
    };
    while(true){
      const {done, value} = await reader.read();
      if(done) break;
      buf += decoder.decode(value, {stream: true});
      let i;
      while((i = buf.indexOf("\n\n")) >= 0){
        handleEvent(buf.slice(0, i)); buf = buf.slice(i + 2);
      }
    }
    if(buf.trim()) handleEvent(buf);
    finish(false);
  }catch(err){
    if(err && err.name === "AbortError"){ finish(true); return; }
    const offline = !navigator.onLine || /failed|network|load/i.test(String(err));
    addErrorMsg(
      "请求失败：" + escapeHtml(String(err && err.message || err)) +
      (offline ? "<br><br>可能原因：<br>1. 未连接校园网（该服务仅校内可达）<br>2. 推理服务 10.1.88.114:8001 不在线<br>3. 本地代理未启动——请运行 start-chat.bat" : "")
    );
    state.streaming = false; state.abort = null;
    root.classList.remove("streaming");
    $("sendBtn").style.display = "block";
    $("stopBtn").style.display = "none";
    if(!content && !reasoning) root.remove();
    else finish(false);
  }
}

/* ================= 输入与控件 ================= */
function autoResize(){
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 168) + "px";
}
inputEl.addEventListener("input", autoResize);
inputEl.addEventListener("keydown", e => {
  if(e.key === "Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); send(); }
});
$("sendBtn").onclick = send;
$("stopBtn").onclick = () => { if(state.abort) state.abort.abort(); };

$("newChatBtn").onclick = () => {
  if(state.streaming) return toast("生成中，请先停止");
  if(state.messages.length && !confirm("清空当前对话记录？")) return;
  state.messages = []; saveMessages(); renderHistory(); refreshEmpty(); toast("已开始新对话");
};

function syncTemp(){ $("tempVal").textContent = parseFloat($("temperature").value).toFixed(2); }
function syncSpLen(){ $("spLen").textContent = $("systemPrompt").value.length + " 字"; }
["systemPrompt","temperature","maxTokens","thinkingToggle"].forEach(id =>
  $(id).addEventListener("change", () => { syncTemp(); syncSpLen(); saveSettings(); })
);
$("temperature").addEventListener("input", syncTemp);
$("systemPrompt").addEventListener("input", syncSpLen);
$("modelSelect").addEventListener("change", () => {
  state.model = $("modelSelect").value;
  $("headerModel").textContent = state.model;
  saveSettings();
});
$("menuBtn").onclick = () => $("sidebar").classList.toggle("open");
messagesEl.addEventListener("click", e => {
  const btn = e.target.closest("button[data-copy]");
  if(btn) copyText(decodeURIComponent(btn.dataset.copy), btn);
});

/* ================= 启动 ================= */
loadAll();
if(location.protocol === "file:") $("fileWarn").style.display = "block";
renderHistory(); refreshEmpty();
checkStatus();
autoResize();
</script>
</body>
</html>
